<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>James's Kitchen</title>

<style>

body{
font-family:Arial;
max-width:700px;
margin:auto;
padding:20px;
}

select,input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:10px;
background:green;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<h1>🍴 James's Kitchen</h1>

<input id="name" placeholder="Your Name">

<select id="date"></select>

<select id="meal"></select>

<select id="food"></select>

<select id="time"></select>

<label>
Ingredients To Exclude
</label>

<div id="ingredients"></div>

<textarea
id="notes"
placeholder="Special Notes">
</textarea>

<button onclick="submitOrder()">
Place Order
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwEXhJ-USPhTgam1qgzP0_WPkMfXYSN2tsevj10Ro5xMLgV0zUgC38dW0ymJ64pVA1v/exec";

let menuData=[];

async function loadData(){

const response =
await fetch(API_URL);

const data =
await response.json();

menuData = data.menu;

loadDates();
loadIngredients(data.ingredients);
loadTimeSlots(data.timeslots);

}

function loadDates(){

const dateSelect =
document.getElementById("date");

const dates=[
...new Set(
menuData.slice(1)
.map(r=>r[0])
)
];

dates.forEach(date=>{

const option =
document.createElement("option");

option.value=date;
option.text=date;

dateSelect.add(option);

});

dateSelect.onchange =
updateMeals;

updateMeals();

}

function updateMeals(){

const selectedDate =
document.getElementById("date").value;

const mealSelect =
document.getElementById("meal");

mealSelect.innerHTML="";

const meals=[
...new Set(
menuData.slice(1)
.filter(r=>r[0]==selectedDate)
.map(r=>r[1])
)
];

meals.forEach(meal=>{

const option =
document.createElement("option");

option.value=meal;
option.text=meal;

mealSelect.add(option);

});

mealSelect.onchange=
updateFood;

updateFood();

}

function updateFood(){

const date =
document.getElementById("date").value;

const meal =
document.getElementById("meal").value;

const foodSelect =
document.getElementById("food");

foodSelect.innerHTML="";

const foods =
menuData.slice(1)
.filter(r=>
r[0]==date &&
r[1]==meal
);

foods.forEach(food=>{

const option =
document.createElement("option");

option.value=food[2];
option.text=food[2];

foodSelect.add(option);

});

}

function loadIngredients(data){

const div =
document.getElementById("ingredients");

div.innerHTML="";

data.slice(1).forEach(row=>{

div.innerHTML += `
<label>
<input type="checkbox"
value="${row[0]}"
class="ingredient">
${row[0]}
</label><br>
`;

});

}

function loadTimeSlots(data){

const select =
document.getElementById("time");

data.slice(1).forEach(row=>{

const option =
document.createElement("option");

option.value=row[0];

option.text=row[0];

select.add(option);

});

}

async function submitOrder(){

const exclusions =
Array.from(
document.querySelectorAll(
".ingredient:checked"
)
).map(x=>x.value);

await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
name:
document.getElementById("name").value,

date:
document.getElementById("date").value,

meal:
document.getElementById("meal").value,

food:
document.getElementById("food").value,

time:
document.getElementById("time").value,

exclusions:
exclusions.join(", "),

notes:
document.getElementById("notes").value
})
});

alert("Order submitted!");

}

loadData();

</script>

</body>
</html>
